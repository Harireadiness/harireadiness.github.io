  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:1;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");

  }
  #app { position: relative; z-index: 2; }

  /* ── Responsive — desktop > 1024px untouched ─────────────────────────────
     Pattern: every responsive component carries a stable className so this
     block is the single source of truth for breakpoint behaviour. */

  /* Tablet portrait (≤ 768px) — survey collapses inner grid, intake stays
     two-col, stats drop to two columns, report grids collapse. */
  @media (max-width: 768px) {
    /* Landing + survey + interstitials */
    .ps-landing       { padding: 48px 40px 72px !important; }
    .ps-survey        { padding: 32px 40px 48px !important; }
    .ps-intake-card   { padding: 32px 32px !important; }

    /* Stats strip — 4 → 2 cols, match new intake-card padding */
    .ps-stats { grid-template-columns: repeat(2, 1fr) !important; gap: 28px !important; padding: 0 32px !important; }

    /* Answer button intermediate column widths */
    .ps-answer-btn {
      grid-template-columns: 36px 160px 1fr !important;
      column-gap: 14px !important;
      padding: 12px 18px !important;
    }

    /* Report card */
    .pr-actions       { padding: 20px 32px 0 !important; flex-wrap: wrap !important; gap: 14px !important; }
    .pr-card-wrap     { padding: 20px 32px 80px !important; }
    .pr-card-header   { padding: 28px 32px !important; }
    .pr-card-inner    { padding: 32px !important; }
    .pr-archetype-grid { grid-template-columns: 1fr !important; gap: 24px !important; }
    .pr-archetype-band { justify-content: flex-start !important; }
    .pr-petal-grid    { grid-template-columns: 1fr !important; gap: 24px !important; }
    .pr-cta-grid      { grid-template-columns: 1fr !important; gap: 16px !important; }
    .pr-modal-grid    { grid-template-columns: 1fr !important; gap: 18px !important; }
    .pr-modal-shell   { padding: 32px 24px !important; }
  }

  /* Phone (≤ 640px) — answer buttons stack vertically, intake collapses
     to one column, generating + halfway tighten padding. */
  @media (max-width: 640px) {
    .ps-landing       { padding: 40px 20px 56px !important; }
    .ps-survey        { padding: 24px 20px 40px !important; }
    .ps-generating,
    .ps-halfway       { padding: 48px 24px !important; min-height: 70vh !important; }
    .ps-intake-card   { padding: 28px 22px !important; }
    .ps-intake-grid   { grid-template-columns: 1fr !important; gap: 22px !important; }
    .ps-stats         { grid-template-columns: repeat(2, 1fr) !important; gap: 28px !important; padding: 0 22px !important; }
    .ps-stat-num      { font-size: 20px !important; }

    /* Answer buttons — number + label on row 1, anchor sentence on row 2 */
    .ps-answer-btn {
      display: grid !important;
      grid-template-columns: auto 1fr !important;
      grid-template-areas: "num label" "anchor anchor" !important;
      align-items: center !important;
      column-gap: 14px !important;
      row-gap: 8px !important;
      padding: 14px 16px !important;
      min-height: 44px !important;
    }
    .ps-answer-num    { grid-area: num !important; }
    .ps-answer-label  { grid-area: label !important; font-size: 13px !important; }
    .ps-answer-anchor { grid-area: anchor !important; }

    /* Survey nav back-button tappable area */
    .ps-back-btn      { padding: 12px 8px !important; min-height: 44px !important; }
    .ps-startover-btn { padding: 14px 12px !important; min-height: 44px !important; }
    .ps-privacy-link  { padding: 12px 4px !important; display: inline-block !important; min-height: 44px !important; }

    /* Survey progress chip — wrap allowed */
    .ps-dim-row       { flex-wrap: wrap !important; gap: 12px !important; }

    /* Halfway + generating type scale */
    .ps-halfway-title    { font-size: 36px !important; }
    .ps-generating-title { font-size: 30px !important; }
    .ps-generating-progress { width: 100% !important; max-width: 280px !important; }

    /* Report card */
    .pr-actions       { padding: 16px 20px 0 !important; }

    .pr-card-header   { padding: 24px 22px !important; flex-direction: column !important; gap: 18px !important; }
    .pr-card-header-right { text-align: left !important; }
    .pr-card-inner    { padding: 24px 20px !important; }
    .pr-archetype-name { font-size: clamp(28px, 9vw, 36px) !important; }

<script type="text/babel">
const { useState: useAppState } = React;

function PulseApp() {
  const [stage, setStage] = useAppState('landing'); // landing | survey | generating | report
  const [intake, setIntake] = useAppState({
    fName: '', fSurname: '', fEmail: '', fOrg: '',
    fSector: '', fGeo: '', fRole: '', fMaturity: '',
  });
  const [answers, setAnswers] = useAppState(Array(window.PULSE_QUESTIONS.length).fill(null));
  const [scoring, setScoring] = useAppState(null);

  const scoreAndAdvance = async () => {
    // Transition to generating screen immediately for perceived responsiveness
    setStage('generating');

    // Map intake fields to API request format
    const roleMap = {
      'C-Suite / Board': 'C-Suite·Board',
      'Senior Management': 'Senior Management',
      'Middle Management': 'Middle Management',
      'Individual Contributor': 'Individual Contributor',
      'Other': 'Other',
    };

    const payload = {
      intake: {
        name: `${intake.fName} ${intake.fSurname}`.trim(),
        email: intake.fEmail,
        organisation: intake.fOrg,
        sector: intake.fSector,
        geography: intake.fGeo,
        role_level: roleMap[intake.fRole] || intake.fRole,
        ai_maturity: intake.fMaturity,
      },
      answers: answers.map(a => a), // plain integer array (1-5)
      honeypot: '',
    };

    try {
      const res = await fetch('https://api.harireadiness.com/pulse', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-API-Key': window.PULSE_API_KEY || '',
        },
        body: JSON.stringify(payload),
      });

      if (!res.ok) throw new Error(`API ${res.status}`);
      const data = await res.json();

      // Map API response to the scoring shape the report component expects
      const archetypeMap = {
        'RO': window.PULSE_ARCHETYPES[0],
        'MG': window.PULSE_ARCHETYPES[1],
        'CP': window.PULSE_ARCHETYPES[2],
        'FB': window.PULSE_ARCHETYPES[3],
      };

      const s = {
        dimAvg: data.dimension_bands.map(d => d._mean),
        archetype: archetypeMap[data.archetype] || window.PULSE_ARCHETYPES[3],
        bindIdx: data.binding_index,
        strongestIdx: data.strongest_index,
        // Enrich with API-provided personalised content
        apiInsight: data.insight,
        apiValueLevel: data.value_level,
        apiMeta: data.meta,
        completionDate: data.completion_date,
      };

      window.__lastScoring = s;
      setScoring(s);
    } catch (err) {
      console.error('[Pulse] API call failed:', err.message);
      // No local fallback — API is required for scoring
      setScoring({ error: true, message: err.message });
    }
  };

  const restart = () => {
    setAnswers(Array(window.PULSE_QUESTIONS.length).fill(null));
    setScoring(null);
    setStage('landing');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  return (
    <>
      <header style={{
        padding: '24px 64px',
        display: 'flex', justifyContent: 'space-between', alignItems: 'center',
        background: '#F8F7F3', position: 'sticky', top: 0, zIndex: 5,
      }}>
        <a href="HARI Pulse Landing.html" style={{ display: 'flex', alignItems: 'center', gap: 16, textDecoration: 'none' }}>
          <HARIMark size={42} />
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start' }}>
            <div style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 22, color: '#0D2240', letterSpacing: '0.02em', lineHeight: 1 }}>HARI</div>
            <div style={{ fontSize: 9, letterSpacing: '0.28em', fontWeight: 600, color: '#5C7298', marginTop: 6 }}>HUMAN-AI&nbsp;READINESS&nbsp;INDEX</div>
          </div>
        </a>
        <a href="HARI Pulse Landing.html" style={{
          fontSize: 11, fontWeight: 600, letterSpacing: '0.24em', color: '#5C7298',
          textDecoration: 'none', fontFamily: 'Inter, sans-serif', whiteSpace: 'nowrap',
        }}>← BACK TO HARI</a>
      </header>

      <main>
        {stage === 'landing' && (
          <PulseLanding
            intake={intake}
            setIntake={setIntake}
            onStart={() => { setStage('survey'); window.scrollTo({ top: 0 }); }}
          />
        )}
        {stage === 'survey' && (
          <PulseSurvey
            answers={answers}
            setAnswers={setAnswers}
            onComplete={scoreAndAdvance}
            onExit={restart}
          />
        )}
        {stage === 'generating' && (
          <PulseGenerating onDone={() => setStage('report')} />
        )}
        {stage === 'report' && scoring && (
          <PulseReport
            intake={intake}
            setIntake={setIntake}
            scoring={scoring}
            onRestart={restart}
          />
        )}
      </main>

      <footer style={{
        padding: '48px 56px 40px', background: '#F8F7F3',
        display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', flexWrap: 'wrap', gap: 32,
      }}>
        {/* THL canonical lockup — mark + wordmark + tagline (brand v0.4 §06, §08) */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
          <svg viewBox="0 0 80 80" width="44" height="44" xmlns="http://www.w3.org/2000/svg" style={{ flexShrink: 0 }}>
            <rect x="6" y="14" width="68" height="6" fill="#0D2240" rx="1"/>
            <rect x="6" y="24" width="68" height="6" fill="#0D2240" rx="1"/>
            <rect x="6" y="34" width="68" height="6" fill="#0D2240" rx="1"/>
            <rect x="6" y="48" width="68" height="20" fill="#5C7298" rx="2"/>
          </svg>
          <div>
            <div style={{ fontFamily: 'Inter, sans-serif', fontSize: 15, fontWeight: 500, letterSpacing: '0.22em', color: '#0D2240', lineHeight: 1 }}>THE HUMAN LAYER</div>
            <div style={{ fontFamily: 'Inter, sans-serif', fontSize: 9, fontWeight: 600, letterSpacing: '0.22em', color: '#5C7298', marginTop: 6 }}>IDENTIFIED. NAMED. MEASURED.</div>
          </div>
        </div>
        {/* Right side: HARI lockup on top, © meta at the bottom. The whole
            column is flex-end-aligned with the left lockup at footer level. */}
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 10 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
            <HARIMark size={28} />
            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start' }}>
              <div style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: 16, color: '#0D2240', letterSpacing: '0.04em', lineHeight: 1 }}>HARI</div>
              <div style={{ fontSize: 9, letterSpacing: '0.28em', fontWeight: 600, color: '#5C7298', marginTop: 5, whiteSpace: 'nowrap' }}>HUMAN-AI READINESS INDEX</div>
            </div>
          </div>
          <div style={{ fontSize: 9, letterSpacing: '0.22em', fontWeight: 600, color: '#9A9388', fontFamily: 'Inter, sans-serif' }}>
            © 2026 · v3.3 · THEHUMANLAYER.IO
          </div>
        </div>
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<PulseApp />);
</script>


</body></html>
